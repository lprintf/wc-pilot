user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        location = /WW_verify_wVpUiYfAUwoEd9II.txt {
            root /usr/share/nginx/html;
            default_type text/plain;
            try_files $uri =404;
        }

        location = /health/live {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /health/ready {
            proxy_pass http://backend:8000/health/ready;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = / {
            add_header Cache-Control "no-store";
            try_files /index.html =404;
        }

        location = /admin/ {
            auth_request /_admin_auth;
            add_header Cache-Control "no-store";
            try_files /admin/index.html =404;
        }

        location = /_admin_auth {
            internal;
            proxy_pass http://backend:8000/api/admin/session;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/(robots\.txt|sitemap\.xml)$ {
            try_files $uri =404;
        }

        location = /me/ {
            add_header Cache-Control "no-store";
            try_files /me/index.html =404;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /wecom/kf/callback {
            proxy_pass http://backend:8000/wecom/kf/callback;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /auth/t/ {
            access_log off;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /me {
            proxy_pass http://backend:8000/me;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /admin {
            proxy_pass http://backend:8000/admin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /favicon.ico {
            access_log off;
            return 204;
        }

        location / {
            return 404;
        }
    }
}
