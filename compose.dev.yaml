# Development overlay: docker compose -f docker-compose.yml -f compose.dev.yaml up -d --build
# Mount source directories individually to preserve the image's Linux dependencies.
services:
  backend:
    command:
      - /app/.venv/bin/uvicorn
      - wechat_bot.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
      - --reload
      - --reload-dir
      - /app/wechat_bot
      - --reload-dir
      - /app/garden
      - --reload-dir
      - /app/prompts
    volumes:
      - ./backend/wechat_bot:/app/wechat_bot:ro
      - ./backend/garden:/app/garden:ro
      - ./backend/prompts:/app/prompts:ro
      - ./backend/skills:/app/skills:ro
      - ./backend/scripts:/app/scripts:ro
      - ./backend/tests:/app/tests:ro
      - ./backend/main.py:/app/main.py:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  frontend-builder:
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/admin:/app/admin:ro
      - ./frontend/me:/app/me:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro

  gateway:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
